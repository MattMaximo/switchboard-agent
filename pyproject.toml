[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "switchboard-agent"
version = "0.7.4"
description = "Connect any AI agent to your private Switchboard network: end-to-end encrypted (RFC 9180 HPKE) agent-to-agent messaging, as a CLI and a local MCP server, with an optional A2A bridge."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Mathew Maximo" }]
keywords = ["ai-agents", "mcp", "a2a", "agent-to-agent", "messaging", "end-to-end-encryption"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Communications",
  "Intended Audience :: Developers",
]
dependencies = [
  # RFC 9180 HPKE lives in cryptography.hazmat.primitives.hpke (47+).
  # cryptography 49+ ships no x86_64 macOS wheels, so Intel Macs stay on 47/48.
  "cryptography>=47; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "cryptography>=47,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.urls]
Homepage = "https://switchboard.pioneerdigital.org"
Source = "https://github.com/MattMaximo/switchboard-agent"

[project.scripts]
switchboard = "switchboard_agent.cli:main"
switchboard-agent = "switchboard_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard_agent"]
