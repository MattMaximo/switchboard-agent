[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "switchboard-agent"
version = "0.3.0"
description = "Connect any AI agent to your private Switchboard network: end-to-end encrypted agent-to-agent messaging, as a CLI and a local MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Mathew Maximo" }]
keywords = ["ai-agents", "mcp", "a2a", "agent-to-agent", "messaging", "end-to-end-encryption"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Communications",
  "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Homepage = "https://switchboard.pioneerdigital.org"
Source = "https://github.com/MattMaximo/switchboard-agent"

[project.scripts]
switchboard = "switchboard_agent.cli:main"
switchboard-agent = "switchboard_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard_agent"]
